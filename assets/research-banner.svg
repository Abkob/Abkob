<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Abdulrahman Kobeissi - Biomedical AI and Research Engineering</title>
  <desc id="desc">Dark blue research profile banner with ECG and EEG inspired signal traces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07182c"/>
      <stop offset="0.55" stop-color="#102f49"/>
      <stop offset="1" stop-color="#0d4b57"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d2d2" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#54d2d2"/>
      <stop offset="0.72" stop-color="#8ee3cf"/>
      <stop offset="1" stop-color="#8ee3cf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9cc8d1" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1050" cy="50" r="180" fill="#5ec7b7" opacity="0.07"/>
  <circle cx="1140" cy="275" r="120" fill="#78b9df" opacity="0.06"/>
  <path d="M20 226 H155 L170 219 L185 232 L200 224 H270 L283 209 L298 249 L314 141 L330 238 L345 220 H430 L445 213 L460 228 L477 220 H565 L579 205 L594 238 L611 178 L628 231 L644 219 H735 L752 211 L768 229 L784 219 H870 L887 206 L902 239 L919 159 L936 235 L952 220 H1180" fill="none" stroke="url(#line)" stroke-width="3" filter="url(#glow)"/>
  <text x="72" y="105" fill="#f5fbfc" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="0.3">Abdulrahman Kobeissi</text>
  <text x="75" y="151" fill="#aee5e0" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" letter-spacing="1.6">BIOMEDICAL AI · SIGNAL PROCESSING · RESEARCH ENGINEERING</text>
  <rect x="75" y="174" width="480" height="2" fill="#65d3c6" opacity="0.65"/>
  <text x="75" y="276" fill="#d6e9ed" font-family="Consolas, Menlo, monospace" font-size="18">evidence → implementation → evaluation → reproducibility</text>
</svg>
